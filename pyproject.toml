[project]
name = "zynmail-be"
version = "0.1.0"
description = "Zynmail — AI-powered mailing platform backend"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "bleach>=6.4.0",
    "fastapi>=0.140.0",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "google-auth-oauthlib>=1.4.0",
    "langchain>=1.3.14",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.9",
    "motor>=3.7.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymongo>=4.17.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "tinycss2>=1.5.1",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pyright]
include = ["app"]
extraPaths = ["."]

